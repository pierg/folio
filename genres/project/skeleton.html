<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{project name}}</title>
<meta name="genre" content="{genre}">
<meta name="title" content="{{project name}}">
<meta name="description" content="{{one sentence: what the project is and what it produces}}">
<meta name="reviewed" content="{date}">
<meta name="tags" content="{{tags}}">
<link rel="stylesheet" href="/shell/folio.css">
<script src="/shell/folio.js" defer></script>
</head>
<body>
<main>

<p class="state">{{what is true on the reviewed date, in one or two sentences}}</p>

<h2 id="next">Next</h2>
<ul>
<li>{{the next step}}</li>
</ul>

<h2 id="blocked">Blocked</h2>
<ul>
<li>{{optional: what is waiting, and on what}}</li>
</ul>

<h2 id="code">Where the code lives</h2>
<ul>
<li><a href="{{link to a repository or other place outside the library}}">{{its name}}</a></li>
</ul>

</main>
</body>
</html>
