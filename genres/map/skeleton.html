<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="genre" content="{genre}">
<meta name="title" content="{{title}}">
<meta name="description" content="{{one sentence: what part of the library this map covers}}">
<meta name="tags" content="{{tags}}">
<link rel="stylesheet" href="/shell/folio.css">
<script src="/shell/folio.js" defer></script>
</head>
<body>
<main>

<h2 id="take">Current take</h2>
<p>{{optional: a few sentences of stance; what is settled and what is not}}</p>

<h2 id="{{group-id}}">{{group name}}</h2>
<ul class="rows">
<li><a href="{{link to a document}}">{{its title}}</a> <span class="why">{{optional: the reason to follow it from this map; delete the span to show its description}}</span></li>
</ul>

<h2 id="open">Open</h2>
<ul>
<li>{{optional: a question this part of the library has not answered}}</li>
</ul>

</main>
</body>
</html>
