<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 504" role="img" aria-label="How folio works. You ask your coding agent in plain words. The agent picks one of seven skills; the write skill adds typed, linked documents to the library, a folder in git, and every change passes folio check before it is committed. In the sample library, Attention notes, a map links an entry, Why attention is quadratic, a note on FlashAttention tiling and a concept, Softmax; a journal entry dated 2026-10-03 is about the note. folio serve renders the library as a site. A reader's comment on a page, Does this hold for linear attention?, is saved in a file beside that page and committed; the address skill answers it and edits the page." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
svg{--ink:#ece9e2;--ink-soft:#b7b1a6;--ink-faint:#868075;--rule:#2e2d29;--rule-strong:#4a4740;--panel:#1c1c19;--surface:#151513;--paper:#151513;--accent:#e09572;--accent-soft:#3a2a21;--link:#93bde4;--mark:#5a4b16;--ok:#8fcf98;--ok-soft:#1f3123;--lab:#a7abf3;--lab-soft:#23264a;}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.mono,.lab,.lab-acc,.eyebrow{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
.serif{font-family:'Iowan Old Style',Charter,'Bitstream Charter',Cambria,Georgia,serif}
.box{fill:var(--panel);stroke:var(--ink-soft);stroke-width:1.6}
.tile{fill:var(--surface);stroke:var(--rule-strong);stroke-width:1.3}
.chip{fill:var(--surface);stroke:var(--rule-strong);stroke-width:1.2}
.chip-acc{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.page{fill:var(--paper);stroke:var(--ink-soft);stroke-width:1.6}
.bubble{fill:var(--surface);stroke:var(--rule-strong);stroke-width:1.3}
.bubble-acc{fill:var(--surface);stroke:var(--accent);stroke-width:1.5}
.sheet{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.3;stroke-dasharray:4 3}
.bar{fill:var(--rule)}
.hl{fill:var(--mark)}
.fill-acc{fill:var(--accent)}
.fill-ink{fill:var(--ink-soft)}
.rule{stroke:var(--rule);stroke-width:1.2}
.edge{fill:none;stroke:var(--ink-soft);stroke-width:1.6}
.e-acc{fill:none;stroke:var(--accent);stroke-width:1.7}
.link{fill:none;stroke:var(--ink-faint);stroke-width:1.3}
.link-dash{fill:none;stroke:var(--ink-faint);stroke-width:1.3;stroke-dasharray:3 3}
.t{fill:var(--ink);font-size:14px}
.t-strong{fill:var(--ink);font-size:14px;font-weight:600}
.soft{fill:var(--ink-soft);font-size:13px}
.mono{fill:var(--ink);font-size:13.5px}
.mono-soft{fill:var(--ink-soft);font-size:13px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
.lab{fill:var(--ink-soft);font-size:13px;letter-spacing:.06em}
.lab-acc{fill:var(--accent);font-size:13px;letter-spacing:.04em}
.eyebrow{fill:var(--accent);font-size:13px;font-weight:700;letter-spacing:.08em}
.chip-t{fill:var(--ink);font-size:13.5px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
.chip-t-acc{fill:var(--accent);font-size:13.5px;font-weight:700;font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
.link-t{fill:var(--link);font-size:13.5px}
.fill-lab{fill:var(--lab)}
.e-lab{fill:none;stroke:var(--lab);stroke-width:1.7}
.box-lab{fill:var(--lab-soft);stroke:var(--lab);stroke-width:1.6}
.chip-lab{fill:var(--lab-soft);stroke:var(--lab);stroke-width:1.4}
.lab-lab{fill:var(--lab);font-size:13px;letter-spacing:.06em;font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
.zone-acc{fill:var(--accent-soft)}
.zone{fill:var(--panel)}
.serif-t{fill:var(--ink);font-family:'Iowan Old Style',Charter,'Bitstream Charter',Cambria,Georgia,serif}
.serif-soft{fill:var(--ink-soft);font-family:'Iowan Old Style',Charter,'Bitstream Charter',Cambria,Georgia,serif}
.uline{stroke:var(--link);stroke-width:1.2;stroke-dasharray:1.5 2}
</style>
<defs>
<marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" class="fill-ink"/></marker>
<marker id="ar-acc" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" class="fill-acc"/></marker>
<marker id="ar-lab" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" class="fill-lab"/></marker>
</defs>


<!-- ============ YOU ============ -->
<text class="lab" x="16" y="30">YOU, IN PLAIN WORDS</text>
<rect class="bubble" x="16" y="42" width="200" height="28" rx="14"/>
<text class="t" x="30" y="61">“add a concept for softmax”</text>
<rect class="bubble" x="16" y="78" width="124" height="28" rx="14"/>
<text class="t" x="30" y="97">“tidy the maps”</text>
<rect class="bubble-acc" x="16" y="114" width="190" height="28" rx="14"/>
<text class="t" x="30" y="133">“go through my comments”</text>
<rect class="bubble" x="16" y="150" width="128" height="28" rx="14"/>
<text class="t" x="30" y="169">“build the site”</text>
<path class="edge" d="M109,180 L109,205" marker-end="url(#ar)"/>

<!-- ============ AGENT ============ -->
<rect class="box" x="16" y="206" width="186" height="282" rx="10"/>
<text class="lab" x="32" y="232">YOUR CODING AGENT</text>
<text class="soft" x="32" y="252">picks one of seven skills</text>
<rect class="chip" x="32" y="266" width="154" height="24" rx="5"/><text class="chip-t" x="109" y="283" text-anchor="middle">set-up</text>
<rect class="chip" x="32" y="296" width="154" height="24" rx="5"/><text class="chip-t" x="109" y="313" text-anchor="middle">configure</text>
<rect class="chip-acc" x="32" y="326" width="154" height="24" rx="5"/><text class="chip-t-acc" x="109" y="343" text-anchor="middle">write</text>
<rect class="chip" x="32" y="356" width="154" height="24" rx="5"/><text class="chip-t" x="109" y="373" text-anchor="middle">organise</text>
<rect class="chip-acc" x="32" y="386" width="154" height="24" rx="5"/><text class="chip-t-acc" x="109" y="403" text-anchor="middle">address</text>
<rect class="chip" x="32" y="416" width="154" height="24" rx="5"/><text class="chip-t" x="109" y="433" text-anchor="middle">publish</text>
<rect class="chip" x="32" y="446" width="154" height="24" rx="5"/><text class="chip-t" x="109" y="463" text-anchor="middle">run</text>

<!-- ============ LIBRARY ============ -->
<rect class="box" x="306" y="16" width="270" height="472" rx="10"/>
<text class="lab" x="322" y="42">THE LIBRARY · IN GIT</text>
<text class="mono" x="322" y="70">folio.yaml</text><text class="soft" x="416" y="70">the charter</text>
<text class="mono" x="322" y="94">content/</text><text class="soft" x="398" y="94">typed, linked documents</text>

<!-- links between documents -->
<path class="link" d="M358,160 L358,306"/>
<path class="link" d="M406,160 L430,206"/>
<path class="link" d="M478,268 L496,306"/>
<path class="link" d="M440,337 L448,337"/>
<path class="link-dash" d="M512,160 L486,206"/>
<text class="mono-soft" x="518" y="190">about</text>

<rect class="tile" x="320" y="116" width="120" height="44" rx="6"/>
<text class="eyebrow" x="332" y="134">MAP</text><text class="t" x="332" y="152">Attention</text>
<rect class="tile" x="448" y="116" width="120" height="44" rx="6"/>
<text class="eyebrow" x="460" y="134">JOURNAL</text><text class="mono-soft" x="460" y="152">2026-10-03</text>
<rect class="tile" x="384" y="206" width="124" height="62" rx="6"/>
<text class="eyebrow" x="396" y="224">NOTE</text><text class="t" x="396" y="242">FlashAttention</text><text class="t" x="396" y="260">tiling</text>
<rect class="tile" x="320" y="306" width="120" height="62" rx="6"/>
<text class="eyebrow" x="332" y="324">ENTRY</text><text class="t" x="332" y="342">Why attention</text><text class="t" x="332" y="360">is quadratic</text>
<rect class="tile" x="448" y="306" width="120" height="44" rx="6"/>
<text class="eyebrow" x="460" y="324">CONCEPT</text><text class="t" x="460" y="342">Softmax</text>

<!-- the comment file, beside its page -->
<path class="link-dash" d="M372,368 L372,384"/>
<rect class="sheet" x="320" y="384" width="200" height="28" rx="4"/>
<text class="mono" x="332" y="403" style="fill:var(--accent)">entry.annotations.json</text>

<text class="mono" x="322" y="446">.folio/</text><text class="soft" x="386" y="446">generated indices</text>
<text class="mono-soft" x="322" y="468">catalog · backlinks · search</text>

<!-- ============ GAP 1: write through the gate, comments back ============ -->
<path class="e-acc" d="M186,337 L319,337" marker-end="url(#ar-acc)"/>
<text class="lab-acc" x="253" y="276" text-anchor="middle" font-weight="700">folio check</text>
<text class="soft" x="253" y="294" text-anchor="middle">then commit</text>
<rect class="fill-acc" x="248" y="306" width="10" height="64" rx="2"/>
<path class="e-acc" d="M319,398 L187,398" marker-end="url(#ar-acc)"/>
<text class="soft" x="253" y="420" text-anchor="middle">answers it,</text>
<text class="soft" x="253" y="437" text-anchor="middle">edits the page</text>

<!-- ============ GAP 2: render, comment back ============ -->
<path class="edge" d="M576,138 L677,138" marker-end="url(#ar)"/>
<text class="t" x="627" y="128" text-anchor="middle">renders</text>
<text class="mono-soft" x="627" y="158" text-anchor="middle">folio serve</text>
<path class="e-acc" d="M692,398 L521,398" marker-end="url(#ar-acc)"/>
<text class="t" x="627" y="388" text-anchor="middle">a comment</text>
<text class="mono-soft" x="627" y="422" text-anchor="middle">committed</text>

<!-- ============ SITE ============ -->
<rect class="page" x="678" y="16" width="206" height="472" rx="10"/>
<line class="rule" x1="679" y1="50" x2="883" y2="50"/>
<rect class="fill-acc" x="692" y="28" width="9" height="9" rx="1.5" transform="rotate(45 696.5 32.5)"/>
<text class="t-strong serif" x="710" y="38">Attention notes</text>
<rect class="chip" x="840" y="24" width="32" height="18" rx="9"/>
<circle cx="853" cy="32" r="4" fill="none" stroke="var(--ink-soft)" stroke-width="1.4"/>
<path d="M856,35 L860,39" stroke="var(--ink-soft)" stroke-width="1.4"/>

<text class="eyebrow" x="694" y="78">ENTRY</text>
<text class="serif" x="694" y="103" style="fill:var(--ink);font-size:20px;font-weight:700">Why attention</text>
<text class="serif" x="694" y="126" style="fill:var(--ink);font-size:20px;font-weight:700">is quadratic</text>
<text class="soft serif" x="694" y="150" style="font-size:14px">Every token attends to</text>
<text class="soft serif" x="694" y="168" style="font-size:14px">every other token, so cost</text>
<text class="soft serif" x="694" y="186" style="font-size:14px">grows with the square</text>
<text class="soft serif" x="694" y="204" style="font-size:14px">of the context.</text>
<rect class="chip" x="694" y="216" width="92" height="20" rx="4" style="fill:var(--panel);stroke:none"/>
<text class="mono-soft" x="702" y="230">#attention</text>

<rect class="bar" x="694" y="254" width="174" height="6" rx="3"/>
<rect class="bar" x="694" y="268" width="166" height="6" rx="3"/>
<rect class="bar" x="694" y="282" width="96" height="6" rx="3"/>
<rect class="bar" x="694" y="302" width="110" height="10" rx="3" style="fill:var(--rule-strong)"/>
<rect class="bar" x="694" y="324" width="170" height="6" rx="3"/>
<rect class="hl" x="694" y="336" width="136" height="14" rx="2"/>
<rect class="bar" x="700" y="340" width="124" height="6" rx="3" style="fill:var(--ink-faint);opacity:.55"/>

<path d="M712,350 L712,372" class="link" style="stroke:var(--accent)"/>
<rect class="bubble-acc" x="692" y="372" width="180" height="70" rx="8"/>
<text class="t" x="706" y="393">Does this hold for</text>
<text class="t" x="706" y="411">linear attention?</text>
<text class="mono-soft" x="706" y="432">you or a reader</text>

<rect class="bar" x="694" y="458" width="170" height="6" rx="3"/>
<rect class="bar" x="694" y="472" width="120" height="6" rx="3"/>
</svg>
