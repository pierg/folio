name: release

# Publishes folio-kb to PyPI through trusted publishing: no token is stored anywhere.
# One-time setup on pypi.org: Account, Publishing, add a publisher for
#   project folio-kb, owner pierg, repository folio, workflow release.yml, environment pypi.
# Run it by hand from the Actions tab. Pushing a tag does not publish.

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure git for the tests' temporary repositories
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      # Never publish untested: the same gate CI runs.
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Documentation gate
        working-directory: docs
        run: python -m folio check
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
