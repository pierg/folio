<head>

</style>
</head>
<body>
<main>

<div class="deck">
  <section class="slide">
    <h2 class="kx-title">{{the slide's one point}}</h2>
    <aside class="notes"><p>{{what the speaker says, which rests on}} <a href="{{link to a library document}}">{{a document}}</a>.</p></aside>
  </section>
</div>

</main>
</body>
