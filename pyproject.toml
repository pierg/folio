[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
dynamic = ["readme"]
name = "folio-kb"
version = "0.1.0"
description = "A knowledge library a coding agent builds and keeps, checked by a gate."
license = "MIT"
authors = [{ name = "Piergiuseppe Mallozzi" }]
requires-python = ">=3.10"
dependencies = ["pyyaml", "markdown-it-py"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/pierg/folio"
Issues = "https://github.com/pierg/folio/issues"
Documentation = "https://pierg.github.io/folio/"

[project.scripts]
folio = "folio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/folio"]

# The genres, packs and skills ship inside the package; the engine finds them
# there when installed, and in the checkout when run from source.
[tool.hatch.build.targets.wheel.force-include]
"genres" = "folio/_data/genres"
"packs" = "folio/_data/packs"
"skills" = "folio/_data/skills"
"shell" = "folio/_data/shell"
"craft" = "folio/_data/craft"

# The source distribution carries exactly what the wheel is built from. Listed
# explicitly: .agents/ and .claude/ link to skills/ and would otherwise shadow it.
[tool.hatch.build.targets.sdist]
only-include = ["src", "genres", "packs", "skills", "shell", "craft", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# PyPI shows the README outside the repository, so relative links point at GitHub there.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?:)([^)]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/pierg/folio/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?<!!)\[([^\]]*)\]\((?!https?:|#)([^)]+)\)'
replacement = '[\1](https://github.com/pierg/folio/blob/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="(?!https?:)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/pierg/folio/main/\2"'
